name = "canavida-app"
main = "worker.js"
compatibility_date = "2026-10-01"

# La app (archivos estáticos) vive en la raíz del repositorio.
# .assetsignore evita que el código del servidor se publique.
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "canavida"
database_id = "e6f47ae6-c85d-4059-8d8d-b8cad8a4d5b5"

[observability]
enabled = true
